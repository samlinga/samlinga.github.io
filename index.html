<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samlinga</title>
  <meta name="description" content="Plan for kommende samlinger: tid, sted og kommentar.">
  <meta name="theme-color" content="#f4f0e6">
  <!--
    Planen leses fra det publiserte Google-arket.
    Kolonner: dato (eller Tid med en dato), sted, kommentar. Klokkeslett er valgfritt.
  -->
  <style>
    :root {
      --papir: #f4f0e6;
      --kort: #fffcf6;
      --blekk: #221c16;
      --dempet: #5e564c;
      --linje: #e3d9c8;
      --bar: #2f4a3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--papir);
      color: var(--blekk);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      line-height: 1.45;
    }
    .ramme {
      max-width: 38rem;
      margin: 0 auto;
      padding: 3.5rem 1.4rem 4rem;
    }
    .merke {
      margin: 0 0 0.45rem;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bar);
    }
    h1 {
      margin: 0;
      font-size: 2.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .intro {
      margin: 0.85rem 0 0;
      max-width: 28rem;
      color: var(--dempet);
      font-size: 1.08rem;
    }
    .liste { margin-top: 2rem; }
    .kort {
      background: var(--kort);
      border: 1px solid var(--linje);
      border-radius: 14px;
      padding: 1.15rem 1.2rem 1.2rem;
      margin: 0 0 0.8rem;
    }
    .kort.neste {
      border-color: #c9d5cc;
      box-shadow: inset 4px 0 0 var(--bar);
    }
    .etikett {
      margin: 0 0 0.35rem;
      color: var(--bar);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .dato {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .meta {
      margin: 0.45rem 0 0;
      font-size: 1.05rem;
    }
    .kommentar {
      margin: 0.7rem 0 0;
      color: var(--dempet);
      white-space: pre-wrap;
    }
    .tom {
      margin: 2rem 0 0;
      padding-top: 1.2rem;
      color: var(--dempet);
      border-top: 1px solid var(--linje);
    }
    .seksjon {
      margin: 2.4rem 0 0.8rem;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dempet);
      font-weight: 600;
    }
    .tidligere .kort { background: transparent; }
    .tidligere .dato { font-size: 1.15rem; }
  </style>
</head>
<body>
  <div class="ramme">
    <p class="merke">Samlinga</p>
    <h1>Søndagssamlinger</h1>
    <p class="intro">Tid, sted og en kort kommentar for hver samling.</p>
    <main id="innhold">
      <p class="tom">Laster planen…</p>
    </main>
    <noscript><p class="tom">Planen vises når JavaScript er slått på.</p></noscript>
  </div>
  <script>
    const innhold = document.querySelector("#innhold");

    function datoDeler(iso) {
      const treff = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      if (!treff) return null;
      return treff[0];
    }

    function formatDato(iso) {
      const [aar, maaned, dag] = iso.split("-").map(Number);
      const dato = new Date(Date.UTC(aar, maaned - 1, dag));
      const tekst = new Intl.DateTimeFormat("nb-NO", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      }).format(dato);
      return tekst.charAt(0).toUpperCase() + tekst.slice(1);
    }

    function formatTid(tid) {
      const tekst = String(tid || "").trim();
      if (!tekst) return "";
      if (/^kl\.?\s/i.test(tekst)) return tekst;
      return "kl. " + tekst;
    }

    function iDagOslo() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Oslo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function el(tag, klasse, tekst) {
      const node = document.createElement(tag);
      if (klasse) node.className = klasse;
      if (tekst) node.textContent = tekst;
      return node;
    }

    function kort(samling, erNeste, nivaa) {
      const art = el("article", erNeste ? "kort neste" : "kort");
      if (erNeste) art.append(el("p", "etikett", "Neste samling"));
      art.append(el(nivaa, "dato", formatDato(samling.dato)));
      const biter = [];
      const tid = formatTid(samling.tid);
      if (tid) biter.push(tid);
      if (samling.sted && String(samling.sted).trim()) biter.push(String(samling.sted).trim());
      if (biter.length) art.append(el("p", "meta", biter.join(" · ")));
      if (samling.kommentar && String(samling.kommentar).trim()) {
        art.append(el("p", "kommentar", String(samling.kommentar).trim()));
      }
      return art;
    }

    function vis(data) {
      const liste = Array.isArray(data.samlinger) ? data.samlinger : [];
      const gyldige = liste.filter(function (samling) {
        return samling && datoDeler(samling.dato);
      });
      gyldige.sort(function (a, b) {
        return (a.dato + " " + (a.tid || "")).localeCompare(b.dato + " " + (b.tid || ""));
      });
      const iDag = iDagOslo();
      const kommende = gyldige.filter(function (samling) { return samling.dato >= iDag; });
      const tidligere = gyldige.filter(function (samling) { return samling.dato < iDag; }).reverse();

      innhold.replaceChildren();
      if (!kommende.length) {
        innhold.append(el("p", "tom", "Ingen kommende samlinger er lagt inn."));
      } else {
        const seksjon = el("section", "liste");
        seksjon.setAttribute("aria-label", "Kommende samlinger");
        kommende.forEach(function (samling, indeks) {
          seksjon.append(kort(samling, indeks === 0, "h2"));
        });
        innhold.append(seksjon);
      }
      if (tidligere.length) {
        const seksjon = el("section", "liste tidligere");
        seksjon.append(el("h2", "seksjon", "Tidligere"));
        tidligere.forEach(function (samling) {
          seksjon.append(kort(samling, false, "h3"));
        });
        innhold.append(seksjon);
      }
    }

    const ARK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9Jkorah8VvOVucrYbqIAzC8_xbpLAKXnIQ9ssW0rivUAiVfekSlKs6AUcAYCHAEN9211qs1x_v0ar/pub?gid=0&single=true&output=csv";

    function parseCsv(tekst) {
      const rader = [];
      let rad = [];
      let felt = "";
      let i = 0;
      let iSitat = false;
      const kilde = String(tekst || "").replace(/^\uFEFF/, "");
      while (i < kilde.length) {
        const tegn = kilde[i];
        if (iSitat) {
          if (tegn === '"') {
            if (kilde[i + 1] === '"') {
              felt += '"';
              i += 2;
              continue;
            }
            iSitat = false;
            i += 1;
            continue;
          }
          felt += tegn;
          i += 1;
          continue;
        }
        if (tegn === '"') {
          iSitat = true;
          i += 1;
          continue;
        }
        if (tegn === ",") {
          rad.push(felt);
          felt = "";
          i += 1;
          continue;
        }
        if (tegn === "\n" || tegn === "\r") {
          if (tegn === "\r" && kilde[i + 1] === "\n") i += 1;
          rad.push(felt);
          felt = "";
          if (rad.some(function (verdi) { return verdi.trim() !== ""; })) rader.push(rad);
          rad = [];
          i += 1;
          continue;
        }
        felt += tegn;
        i += 1;
      }
      if (felt !== "" || rad.length) {
        rad.push(felt);
        if (rad.some(function (verdi) { return verdi.trim() !== ""; })) rader.push(rad);
      }
      return rader;
    }

    function isoDato(aar, maaned, dag) {
      const y = Number(aar);
      const m = Number(maaned);
      const d = Number(dag);
      if (m < 1 || m > 12 || d < 1 || d > 31) return null;
      const dato = new Date(Date.UTC(y, m - 1, d));
      if (dato.getUTCFullYear() !== y || dato.getUTCMonth() !== m - 1 || dato.getUTCDate() !== d) return null;
      return String(y).padStart(4, "0") + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }

    function parseDato(verdi) {
      const tekst = String(verdi || "").trim();
      let treff = /^(\d{4})-(\d{2})-(\d{2})$/.exec(tekst);
      if (treff) return isoDato(treff[1], treff[2], treff[3]);
      treff = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(tekst);
      if (treff) return isoDato(treff[3], treff[2], treff[1]);
      treff = /^(\d{1,2})\.(\d{1,2})\.(\d{2})$/.exec(tekst);
      if (treff) {
        const kort = Number(treff[3]);
        return isoDato(kort >= 70 ? 1900 + kort : 2000 + kort, treff[2], treff[1]);
      }
      treff = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(tekst);
      if (treff) return isoDato(treff[3], treff[2], treff[1]);
      return null;
    }

    function erKlokkeslett(verdi) {
      return /^\d{1,2}[:.]\d{2}(:\d{2})?$/.test(String(verdi || "").trim());
    }

    function normaliserTid(verdi) {
      const treff = /^(\d{1,2})[:.](\d{2})(?::\d{2})?$/.exec(String(verdi || "").trim());
      if (!treff) return "";
      return String(treff[1]).padStart(2, "0") + ":" + treff[2];
    }

    function splittDatoTid(verdi) {
      const tekst = String(verdi || "").trim();
      const treff = /^(.*?)(?:\s+|T)(\d{1,2}[:.]\d{2}(?::\d{2})?)$/.exec(tekst);
      if (treff && parseDato(treff[1].trim())) {
        return { dato: parseDato(treff[1].trim()), tid: normaliserTid(treff[2]) };
      }
      return { dato: parseDato(tekst), tid: "" };
    }

    function raderTilSamlinger(rader) {
      if (!rader.length) return [];
      const forsteErData = Boolean(splittDatoTid(rader[0][0]).dato);
      const header = forsteErData ? [] : rader[0].map(function (navn) {
        return String(navn || "").trim().toLowerCase().replace(/\s+/g, " ");
      });
      const data = forsteErData ? rader : rader.slice(1);
      const indeks = { dato: -1, tid: -1, sted: -1, kommentar: -1 };
      header.forEach(function (navn, i) {
        if (/^(dato|date)\b/.test(navn)) indeks.dato = i;
        else if (/^(sted|plass|place|lokasjon)\b/.test(navn)) indeks.sted = i;
        else if (/^(kommentar|merknad|note|beskjed)\b/.test(navn)) indeks.kommentar = i;
        else if (/^(tid|klokkeslett|kl)\b/.test(navn)) indeks.tid = i;
      });
      if (indeks.tid >= 0) {
        const prover = data.map(function (rad) { return rad[indeks.tid]; }).filter(Boolean);
        const antallDato = prover.filter(function (verdi) { return splittDatoTid(verdi).dato; }).length;
        const antallTid = prover.filter(erKlokkeslett).length;
        if (antallDato > antallTid) {
          if (indeks.dato < 0) indeks.dato = indeks.tid;
          indeks.tid = -1;
        }
      }
      if (indeks.dato < 0) indeks.dato = 0;
      if (indeks.sted < 0) indeks.sted = 1;
      if (indeks.kommentar < 0) indeks.kommentar = 2;

      return data.map(function (rad) {
        const delt = splittDatoTid(rad[indeks.dato]);
        const tidCelle = indeks.tid >= 0 ? normaliserTid(rad[indeks.tid]) : "";
        return {
          dato: delt.dato,
          tid: tidCelle || delt.tid,
          sted: rad[indeks.sted] || "",
          kommentar: rad[indeks.kommentar] || ""
        };
      }).filter(function (samling) { return samling.dato; });
    }

    fetch(ARK, { cache: "no-cache" })
      .then(function (svar) {
        if (!svar.ok) throw new Error(String(svar.status));
        return svar.text();
      })
      .then(function (tekst) {
        vis({ samlinger: raderTilSamlinger(parseCsv(tekst)) });
      })
      .catch(function () {
        innhold.replaceChildren(el("p", "tom", "Planen kunne ikke lastes."));
      });
  </script>
</body>
</html>
